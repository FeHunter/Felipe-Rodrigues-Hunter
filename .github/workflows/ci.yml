name: Portfolio CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/weekend-case-study"]

permissions:
  contents: read

jobs:
  quality:
    name: Case study lint and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint changed case-study entry points
        run: npx eslint src/App.jsx src/features/portfolio/views/WeekEndCaseStudy.jsx src/features/portfolio/models/portfolio.model.js src/shared/i18n/portfolioTranslations.js
      - name: Build
        run: npm run build
