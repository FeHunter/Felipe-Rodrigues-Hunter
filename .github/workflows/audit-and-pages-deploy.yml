name: Dependency audit and GitHub Pages deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-and-build:
    name: Dependency audit and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate npm audit report
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          const lines = [
            '## Dependency audit',
            '',
            '| Severity | Count |',
            '|---|---:|',
            ...['critical', 'high', 'moderate', 'low', 'info'].map(level => `| ${level} | ${counts[level] ?? 0} |`),
            '',
            `Total: **${counts.total ?? 0}**`,
            '',
            '### Affected packages',
            '',
            '| Package | Severity | Direct | Installed range | Fix available |',
            '|---|---|---:|---|---|',
          ];
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            lines.push(`| ${name} | ${item.severity} | ${item.isDirect ? 'Yes' : 'No'} | ${(item.range ?? '').replaceAll('|', '\\|')} | ${item.fixAvailable ? JSON.stringify(item.fixAvailable) : 'No'} |`);
          }
          if (!Object.keys(report.vulnerabilities ?? {}).length) lines.push('| None | — | — | — | — |');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\\n') + '\\n');
          NODE
      - name: Upload npm audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 14
      - name: Build production site
        run: npm run build

  deploy:
    name: Publish GitHub Pages
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: audit-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production site
        run: npm run build
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
